[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "debate-automated-scoring"
version = "1.0.0"
description = "Reusable scoring and ranking tools for WSDC/TBDEM and British Parliamentary tournaments."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Hammon Dutra"}]
dependencies = [
  "pandas>=2.1,<3.0",
  "openpyxl>=3.1,<4.0",
  "streamlit>=1.39,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
debate-scoring = "debate_scoring.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/debate_scoring"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
